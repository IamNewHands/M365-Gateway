<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Gateway Control · 诊断记录</title>
  <style>
    :root{font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #e9ebf0;border-radius:16px;padding:28px;box-shadow:0 16px 40px -24px rgba(15,23,42,.35)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;font-weight:800}
    h1{font-size:21px;margin:0 0 8px}p{color:#64748b;line-height:1.7;margin:0 0 18px}a{display:inline-flex;padding:10px 15px;border-radius:10px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:650}a:focus-visible{outline:3px solid #c7d2fe;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">GC</span><strong>Gateway Control / M365 Gateway</strong></div>
    <h1>诊断记录已合并到管理后台</h1>
    <p>旧调试页曾尝试展示服务端不会返回的原始请求、上游内容和网关内容，会出现空值，也不符合脱敏边界。现在统一使用管理后台内的有界、结构化诊断记录。</p>
    <a href="/" id="continueLink">前往诊断记录</a>
  </main>
  <script>
    try{sessionStorage.setItem('m365.currentPage','logs')}catch{}
    document.getElementById('continueLink').focus();
  </script>
</body>
</html>
