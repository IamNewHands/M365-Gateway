# Replace the hostname and certificate paths. Keep this vhost dedicated to the
# relay so its privacy-preserving access log format cannot be overridden.
log_format m365_relay '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent request_time=$request_time';

limit_conn_zone $binary_remote_addr zone=m365_relay_conn:10m;
limit_req_zone $binary_remote_addr zone=m365_relay_req:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name relay.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/relay.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/m365-relay.access.log m365_relay;
    error_log  /var/log/nginx/m365-relay.error.log warn;

    client_max_body_size 1k;
    large_client_header_buffers 4 32k;
    limit_conn m365_relay_conn 80;
    limit_req zone=m365_relay_req burst=20 nodelay;

    location = /healthz {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location ~ ^/v1/chathub/[0-9A-Fa-f-]{36}@[0-9A-Fa-f-]{36}$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Relay-Timestamp $http_x_relay_timestamp;
        proxy_set_header X-Relay-Nonce $http_x_relay_nonce;
        proxy_set_header X-Relay-Content-Sha256 $http_x_relay_content_sha256;
        proxy_set_header X-Relay-Signature $http_x_relay_signature;
        proxy_set_header X-M365-Access-Token $http_x_m365_access_token;
        proxy_set_header X-M365-Target-Query $http_x_m365_target_query;
        proxy_read_timeout 920s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
