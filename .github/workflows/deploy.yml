name: Deploy m365-gateway to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy with one-click deployer (update mode)
        run: >
          node deploy-cloudflare.mjs
          --update
          --yes
          --account-id "${{ secrets.CF_ACCOUNT_ID }}"
          --name m365-gateway
          --client-id "${{ secrets.M365_CLIENT_ID }}"
          --kv-id "${{ secrets.M365_KV_ID }}"
